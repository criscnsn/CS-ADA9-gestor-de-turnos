name: CI - Calidad y Pruebas (ADA-08)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Format, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  rust:
    name: Backend Rust (fmt, clippy, test, doc)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Instalar dependencias de sistema en Linux (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Preparar directorio frontendDist para tauri::generate_context!
        shell: bash
        run: mkdir -p dist
      - name: Verificar formato (rustfmt)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: Análisis estático (clippy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Pruebas unitarias (cargo test)
        working-directory: src-tauri
        run: cargo test
      - name: Clippy con inyección de fallos
        working-directory: src-tauri
        run: cargo clippy --all-targets --features test-fault-injection -- -D warnings
      - name: Pruebas con inyección de fallos
        working-directory: src-tauri
        run: cargo test --features test-fault-injection
      - name: Documentación (cargo doc)
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Documentación con inyección de fallos
        working-directory: src-tauri
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --features test-fault-injection
